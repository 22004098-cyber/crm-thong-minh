<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - {{ APP_NAME }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Quên mật khẩu</h1>
    <p class="text-muted">Bản demo tạo liên kết reset hiển thị trực tiếp, không gửi email reset.</p>
    {% if message %}<div class="alert alert-info rounded-4">{{ message }}</div>{% endif %}
    {% if token_url %}<a class="btn btn-success w-100 mb-3" href="{{ token_url }}">Mở liên kết đặt lại mật khẩu demo</a>{% endif %}
    <form method="POST">
        <label class="form-label">Email tài khoản</label>
        <input type="email" class="form-control mb-3" name="email" required>
        <button class="btn btn-primary w-100" type="submit">Tạo liên kết reset</button>
    </form>
    <a class="btn btn-link w-100 mt-2" href="{{ url_for('dang_nhap') }}">Quay lại đăng nhập</a>
</main>
</body>
</html>
