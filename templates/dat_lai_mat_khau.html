<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - {{ APP_NAME }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>Đặt lại mật khẩu</h1>
    {% if error %}<div class="alert alert-danger rounded-4">{{ error }}</div>{% endif %}
    {% if not error or request.method == "POST" %}
    <form method="POST">
        <label class="form-label">Mật khẩu mới</label>
        <input type="password" class="form-control mb-3" name="password" required minlength="8">
        <label class="form-label">Xác nhận mật khẩu</label>
        <input type="password" class="form-control mb-3" name="confirm_password" required minlength="8">
        <button class="btn btn-primary w-100" type="submit">Cập nhật mật khẩu</button>
    </form>
    {% endif %}
    <a class="btn btn-link w-100 mt-2" href="{{ url_for('dang_nhap') }}">Quay lại đăng nhập</a>
</main>
</body>
</html>
